{% extends "news/base.html" %}
{% block title %}Log in &middot; The Newsroom{% endblock %}
{% block content %}
  <h1>Log in</h1>
  <div class="card">
    <form method="post" class="stack">
      {% csrf_token %}
      {{ form.as_p }}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="actions">
        <button type="submit" class="btn">Log in</button>
        <a class="btn secondary" href="{% url 'news:register' %}">Create an account</a>
      </div>
    </form>
  </div>
{% endblock %}
